<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Memo</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <h1>Shopping Memo</h1>
</header>

<!-- ホーム -->
<section id="homeScreen" class="screen active">
    <button onclick="openAdd()">＋ 買い物メモを追加</button>
    <button onclick="openList()">買い物メモを見る</button>
    <button onclick="openPriceHome()">価格メモ</button>
    <button onclick="openSettings()">設定</button>
</section>

<!-- 追加画面 -->
<section id="addScreen" class="screen">
    <h2>買い物メモ追加</h2>
    <div class="inputArea">
        <input id="itemInput" placeholder="商品名">
        <button onclick="addCustom()">追加</button>
    </div>

    <h3>よく買うもの</h3>
    <div id="frequentItems"></div>

    <h3>よく買うもの登録</h3>
    <div class="inputArea">
        <input id="frequentInput" placeholder="登録する商品名">
        <button onclick="addFrequent()">登録</button>
    </div>

    <button onclick="goHome()">戻る</button>
</section>

<!-- 買い物リスト -->
<section id="listScreen" class="screen">
    <h2>買い物リスト</h2>
    <ul id="shoppingList"></ul>
    <button onclick="clearAll()">買い物後に一括削除</button>
    <button onclick="goHome()">戻る</button>
</section>

<!-- 価格メモ ホーム -->
<section id="priceHomeScreen" class="screen">
    <h2>価格メモ</h2>
    <button onclick="openPriceAdd()">価格を記録</button>

    <h3>商品一覧</h3>
    <div id="vegetableList"></div>

    <button onclick="goHome()">戻る</button>
</section>

<!-- 価格追加 -->
<section id="priceAddScreen" class="screen">
    <h2>価格記録</h2>
    <div class="formArea">
        <input id="priceName" placeholder="商品名">
        <select id="priceStore" onchange="toggleOtherStore()"></select>
        <input id="otherStore" placeholder="店名入力" style="display:none;" >
        <input id="priceQuantity" type="number" placeholder="数量" min="1" step="1">
        <input id="priceTotal" type="number" placeholder="合計価格" min="1">
        <input id="priceDate" type="date">
        <button onclick="addPriceHistory()">保存</button>
    </div>
    <button onclick="openPriceHome()">戻る</button>
</section>

<!-- 価格履歴 -->
<section id="priceDetailScreen" class="screen">
    <h2 id="detailTitle"></h2>
    <select id="priceSortSelect" onchange="changePriceSort()">
        <option value="unitPrice">単価が安い順</option>
        <option value="store">店名順</option>
    </select>
    <ul id="priceHistoryList"></ul>
    <button onclick="openPriceHome()">戻る</button>
</section>

<!-- 設定画面 -->
<section id="settingsScreen" class="screen">
    <h2>設定</h2>
    <button onclick="openStoreSettings()">店名リスト編集</button>
    <button onclick="goHome()">戻る</button>
</section>

<!-- 店名設定画面 -->
<section id="storeSettingsScreen" class="screen">
    <h2>店名リスト編集</h2>
    <div class="inputArea">
        <input id="storeInput" placeholder="店名" >
        <button onclick="addStore()">追加</button>
    </div>
    <ul id="storeList"></ul>

    <button onclick="openSettings()">戻る</button>
</section>

<script src="app.js"></script>

</body>
</html>
